# SPA static serving for the self-hosted Rankdelta frontend. All non-file routes fall back to
# index.html so the client-side router (TanStack) can handle them.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. `always` so they are also sent on error responses.
    # Dockerfile.selfhost fills in __SUPABASE_ORIGINS__ (your Supabase, which may be plain
    # http://localhost:8000, plus its websocket origin) and __MCP_ORIGIN__ (where the MCP sign-in
    # form posts). connect-src also allows any https: origin for operator-configured proxies.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: __SUPABASE_ORIGINS__; frame-src 'self' https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com __MCP_ORIGIN__;" always;

    # Long-cache the hashed assets, never the HTML entrypoint.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
